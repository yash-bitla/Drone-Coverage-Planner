[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "droneplan"
version = "0.1.0"
description = "Makespan-minimising multi-drone area mapping with battery range, charging stations and obstacles."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Yash Bitla" }]
dependencies = [
  "numpy>=2.0",
  "numba>=0.61",
  "scipy>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "tabulate>=0.9"]

[project.scripts]
droneplan = "droneplan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/droneplan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["droneplan.coverage._kernels", "droneplan.sortie._kernels"]
disallow_untyped_decorators = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
